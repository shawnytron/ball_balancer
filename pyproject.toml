[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-balancer"
version = "0.1.0"
description = "Webcam and phototransistor ball-and-beam controller for Arduino Mega"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.9,<5",
    "pyserial>=3.5,<4",
]

[project.scripts]
beam-balancer = "beam_balancer.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
